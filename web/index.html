<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#008069">
<title>Proper Rent a Car · asistente (demo)</title>
<style>
/* Interfaz tipo WhatsApp: el asistente se ve como el chat del cliente con la rentadora */
:root {
  --verde: #008069; --verde-burbuja: #d9fdd3; --fondo: #efeae2; --blanco: #ffffff; --texto: #111b21;
  --gris: #667781; --azul-tilde: #53bdeb; --linea: #e9edef;
  --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  --mono: ui-monospace, "SF Mono", Menlo, monospace;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: #d1d7db; font: 15px/1.4 var(--sans); color: var(--texto); display: flex; justify-content: center; }
.chat { width: 100%; max-width: 480px; height: 100dvh; display: flex; flex-direction: column; background: var(--fondo); position: relative; }
/* Patrón sutil de fondo, como el de WhatsApp */
.chat::before { content: ""; position: absolute; inset: 0; pointer-events: none; opacity: .5;
  background-image: radial-gradient(rgba(0,0,0,.035) 1px, transparent 1.2px); background-size: 14px 14px; }
header { position: relative; z-index: 2; background: var(--verde); color: #fff; display: flex; align-items: center; gap: 10px; padding: 10px 12px; padding-top: max(10px, env(safe-area-inset-top)); }
header .atras { width: 18px; opacity: .9; }
header img { width: 38px; height: 38px; border-radius: 50%; object-fit: cover; background: #fff; flex: none; }
header .quien { flex: 1; min-width: 0; }
header .nombre { font-weight: 600; font-size: 16px; display: flex; align-items: center; gap: 4px; }
header .verificado { width: 15px; height: 15px; }
header .estado { font-size: 12.5px; opacity: .85; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
header button { all: unset; cursor: pointer; padding: 6px; border-radius: 50%; display: flex; }
header button:hover { background: rgba(255,255,255,.12); }
header svg { width: 20px; height: 20px; }
#mensajes { position: relative; z-index: 1; flex: 1; overflow-y: auto; padding: 12px 14px 8px; display: flex; flex-direction: column; gap: 4px; }
.dia { align-self: center; background: #fff; color: var(--gris); font-size: 12px; padding: 4px 10px; border-radius: 8px; margin: 2px 0 8px; box-shadow: 0 1px .5px rgba(11,20,26,.13); }
.aviso-demo { align-self: center; text-align: center; background: #ffeecd; color: #54656f; font-size: 12px; padding: 6px 10px; border-radius: 8px; max-width: 88%; margin-bottom: 8px; }
.msj { max-width: 82%; padding: 6px 8px 4px 9px; border-radius: 8px; box-shadow: 0 1px .5px rgba(11,20,26,.13); position: relative; white-space: pre-wrap; word-wrap: break-word; margin-top: 4px; }
.msj .hora { float: right; font-size: 11px; color: var(--gris); margin: 6px 0 -2px 10px; display: inline-flex; align-items: center; gap: 3px; }
.msj .hora svg { width: 16px; height: 11px; }
.bot { align-self: flex-start; background: var(--blanco); border-top-left-radius: 0; }
.yo { align-self: flex-end; background: var(--verde-burbuja); border-top-right-radius: 0; }
.bot::before, .yo::before { content: ""; position: absolute; top: 0; width: 8px; height: 13px; }
.bot::before { left: -8px; background: linear-gradient(to bottom left, var(--blanco) 50%, transparent 50%); }
.yo::before { right: -8px; background: linear-gradient(to bottom right, var(--verde-burbuja) 50%, transparent 50%); }
.msj b { font-weight: 600; }
.detalle { display: block; clear: both; margin-top: 4px; padding-top: 4px; border-top: 1px dashed var(--linea); font: 10.5px/1.5 var(--mono); color: var(--gris); }
.detalle details summary { cursor: pointer; color: var(--verde); }
.detalle details p { margin: 3px 0 0; font-family: var(--sans); font-size: 12px; white-space: normal; }
.escribiendo { display: inline-flex; gap: 3px; padding: 4px 2px; }
.escribiendo i { width: 6px; height: 6px; border-radius: 50%; background: #9aa6ad; animation: salto 1.2s infinite; }
.escribiendo i:nth-child(2) { animation-delay: .15s; } .escribiendo i:nth-child(3) { animation-delay: .3s; }
@keyframes salto { 0%, 60%, 100% { transform: translateY(0); opacity: .5; } 30% { transform: translateY(-3px); opacity: 1; } }
.rapidas { position: relative; z-index: 1; display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 6px; padding: 4px 12px 8px; }
.rapidas button { all: unset; cursor: pointer; background: #fff; color: var(--verde); font-size: 13px; padding: 6px 11px; border-radius: 18px; box-shadow: 0 1px .5px rgba(11,20,26,.13); }
.rapidas button:hover { background: #f5f6f6; }
.error { align-self: center; background: #fff; color: #b3261e; font-size: 12.5px; padding: 6px 10px; border-radius: 8px; margin: 6px 0; }
form { position: relative; z-index: 2; display: flex; align-items: flex-end; gap: 6px; padding: 6px 8px; padding-bottom: max(8px, env(safe-area-inset-bottom)); }
.caja { flex: 1; display: flex; align-items: center; background: #fff; border-radius: 24px; padding: 4px 6px 4px 14px; box-shadow: 0 1px .5px rgba(11,20,26,.13); }
input { flex: 1; border: 0; outline: 0; font: 16px var(--sans); padding: 8px 0; background: transparent; color: var(--texto); min-width: 0; }
.caja svg { width: 22px; height: 22px; color: var(--gris); margin-left: 6px; }
#enviar { all: unset; cursor: pointer; width: 46px; height: 46px; border-radius: 50%; background: var(--verde); display: flex; align-items: center; justify-content: center; flex: none; }
#enviar svg { width: 22px; height: 22px; color: #fff; margin-left: 3px; }
#enviar[disabled] { opacity: .5; cursor: default; }
/* Modo demo (?demo=1): conversación de ejemplo que se reproduce sola hasta que el visitante escribe */
.ejemplo { transform-origin: center; transition: opacity .45s, transform .55s cubic-bezier(.5,0,.75,0), filter .45s, max-height .5s .25s, margin .5s .25s, padding .5s .25s; max-height: 600px; }
.ejemplo.chau { opacity: 0; transform: translateY(-26px) scale(.82) rotate(-1.5deg); filter: blur(6px); max-height: 0; margin: 0; padding-top: 0; padding-bottom: 0; }
.yo.ejemplo.chau { transform: translateY(-26px) scale(.82) rotate(1.5deg); }
.pastilla { align-self: center; background: #fff; color: var(--gris); font-size: 12px; padding: 5px 11px; border-radius: 8px; margin: 8px 0 4px; box-shadow: 0 1px .5px rgba(11,20,26,.13); animation: aparece .45s cubic-bezier(.2,.9,.3,1.3) both; }
.pastilla.verde { background: var(--verde); color: #fff; }
@keyframes aparece { from { opacity: 0; transform: translateY(8px) scale(.9); } }
.rapidas button.tocado { background: #e7f3ef; transform: scale(.95); transition: transform .15s; }
.rapidas.vuelve { animation: aparece .4s both; }
@media (prefers-reduced-motion: reduce) { .ejemplo, .pastilla, .rapidas.vuelve { transition: none; animation: none; } }
</style>
</head>

<script>
// Estado de la conversación en el navegador: id de sesión e historial (por si el servidor serverless no lo recuerda)
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const formato = s => esc(s).replace(/\*\*(.+?)\*\*/g, "<b>$1</b>");
const RUTAS = { politica: "políticas y manual", cotizacion: "agente con herramientas", reclamo: "reclamo → persona", fuera_de_alcance: "fuera de alcance" };
const TILDES = '<svg viewBox="0 0 16 11" aria-hidden="true"><path fill="#53bdeb" d="M11.1.6 4.7 7.6 2 5 1 6l3.7 3.7 7.4-8zM15.1.6 8.7 7.6l-.8-.8-1 1 1.8 1.7 7.4-8z"/></svg>';
const SALUDO = "¡Hola! Soy el asistente de Proper Rent a Car. Te ayudo con disponibilidad, precios y cualquier duda del alquiler. ¿En qué te ayudo?";
let estado = { sesion: null, historial: [] };
try { estado = JSON.parse(sessionStorage.getItem("chat")) || estado; } catch {}
const guardar = () => { try { sessionStorage.setItem("chat", JSON.stringify(estado)); } catch {} };
const hora = () => new Date().toLocaleTimeString("es-AR", { hour: "2-digit", minute: "2-digit" });

function agregar(clase, html) {
  const div = document.createElement("div");
  div.className = "msj " + clase;
  div.innerHTML = html;
  $("#mensajes").appendChild(div);
  $("#mensajes").scrollTop = $("#mensajes").scrollHeight;
  return div;
}
const deBot = (texto, extra = "") => agregar("bot", `${formato(texto)}<span class="hora">${hora()}</span>${extra}`);
const mio = texto => agregar("yo", `${esc(texto)}<span class="hora">${hora()} ${TILDES}</span>`);

function detalle(r) {
  const partes = [RUTAS[r.ruta] || r.ruta, ...r.herramientas, r.proveedor !== "ninguno" ? r.proveedor : "respuesta fija"];
  const fuentes = (r.fuentes || []).map(f => `<details><summary>Manual, pág. ${f.pagina}</summary><p>${esc(f.extracto)}…</p></details>`).join("");
  return `<span class="detalle">${partes.map(esc).join(" · ")}${fuentes}</span>`;
}

async function enviar(texto) {
  texto = texto.trim();
  if (!texto) return;
  $("#rapidas").style.display = "none";
  mio(texto);
  const espera = agregar("bot", '<span class="escribiendo"><i></i><i></i><i></i></span>');
  $("#estado").textContent = "escribiendo…";
  $("#enviar").disabled = true;
  try {
    const r = await fetch("chat", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ mensaje: texto, sesion_id: estado.sesion || undefined, historial: estado.historial.slice(-20) }),
    });
    const datos = await r.json().catch(() => ({}));
    espera.remove();
    if (!r.ok) { agregar("error", esc(datos.detail || "No se pudo responder. Probá de nuevo en un rato.")).className = "error"; return; }
    estado.sesion = datos.sesion_id;
    estado.historial.push({ role: "user", content: texto }, { role: "assistant", content: datos.respuesta });
    guardar();
    deBot(datos.respuesta, detalle(datos));
  } catch {
    espera.remove();
    agregar("error", "Sin conexión con el asistente. Probá de nuevo.").className = "error";
  } finally {
    $("#estado").textContent = "en línea · demo con datos ficticios";
    $("#enviar").disabled = false;
    $("#texto").focus();
  }
}

$("#form").onsubmit = e => { e.preventDefault(); const t = $("#texto").value; $("#texto").value = ""; enviar(t); };
document.querySelectorAll("#rapidas button").forEach(b => b.onclick = () => enviar(b.textContent));
$("#nueva").onclick = () => { estado = { sesion: null, historial: [] }; guardar(); location.reload(); };
// Saludo inicial y, si había una conversación en esta pestaña, se muestra de nuevo
deBot(SALUDO);
for (const m of estado.historial) m.role === "user" ? mio(m.content) : deBot(m.content);
if (estado.historial.length) $("#rapidas").style.display = "none";
// Modo demo (?demo=1, lo usa el portfolio): reproduce una conversación de ejemplo con respuestas reales
// guardadas del asistente. Si el visitante escribe o toca algo, el ejemplo se va y el chat pasa a ser el real.
const DEMO = new URLSearchParams(location.search).has("demo") && !estado.historial.length;
const GUION = [
  { pregunta: "¿Tienen camioneta del 20 al 24 de diciembre?", rapida: true,
    respuesta: "Sí, hay una camioneta disponible: Ford Ranger 4x4 (A06).\nCotización del 20 al 24 de diciembre (4 días): **$ 546.000**.\nIncluye 1 200 km y garantía bloqueada de $ 500.000.\n\nEsta es solo una cotización; para confirmar la reserva, contactá a nuestro equipo.",
    datos: { ruta: "cotizacion", herramientas: ["buscar_disponibilidad", "cotizar"], proveedor: "groq", fuentes: [] } },
  { pregunta: "¿Y qué hago si pincho una goma en la ruta?",
    respuesta: "Estacioná en un lugar seguro, poné las balizas y cambiá la rueda por la de auxilio; si no podés, llamá a asistencia en ruta (el servicio no tiene costo). La reparación de la cubierta corre por cuenta del cliente: hasta $30.000 por pinchadura. [pág. 7]",
    datos: { ruta: "politica", herramientas: [], proveedor: "groq", fuentes: [{ pagina: 7, extracto: "6. Qué hacer si... Pinchadura: estacioná en un lugar seguro, poné las balizas y cambiá la rueda por la de auxilio; si no podés, llamá a asistencia en ruta (el servicio no tiene costo). La reparación de la cubierta corre por cuenta del cliente: hasta $ 30.000 por pinchadura" }] } },
];
let demo = DEMO ? "esperando" : "apagado";   // esperando → corriendo → terminado → apagado
const pausa = ms => new Promise((ok, mal) => setTimeout(() => demo === "corriendo" ? ok() : mal(), ms));
const marcar = el => { el.classList.add("ejemplo"); return el; };

function avisarPosicion() {
  // Le dice al portfolio dónde está la primera respuesta rápida, para que su cursor vaya hasta ahí
  const b = $("#rapidas button");
  if (!b || parent === window || demo !== "esperando") return;
  const r = b.getBoundingClientRect();
  parent.postMessage({ tipo: "demo-listo", x: r.left, y: r.top, w: r.width, h: r.height }, "*");
}

async function reproducir() {
  if (demo !== "esperando") return;
  demo = "corriendo";
  try {
    marcar(agregar("pastilla", "Conversación de ejemplo · respuestas reales del asistente")).className = "pastilla ejemplo";
    for (const paso of GUION) {
      if (paso.rapida) {
        const b = [...document.querySelectorAll("#rapidas button")].find(x => x.textContent === paso.pregunta);
        b?.classList.add("tocado");
        await pausa(350);
        b?.classList.remove("tocado");
        $("#rapidas").style.display = "none";
      } else {
        const caja = $("#texto");
        for (const letra of paso.pregunta) { caja.value += letra; await pausa(38 + Math.random() * 50); }
        await pausa(400);
        caja.value = "";
      }
      marcar(mio(paso.pregunta));
      await pausa(500);
      const espera = marcar(agregar("bot", '<span class="escribiendo"><i></i><i></i><i></i></span>'));
      $("#estado").textContent = "escribiendo…";
      await pausa(1700);
      espera.remove();
      $("#estado").textContent = "en línea · demo con datos ficticios";
      marcar(deBot(paso.respuesta, detalle(paso.datos)));
      await pausa(2200);
    }
    demo = "terminado";
    marcar(agregar("pastilla", "Tu turno: escribí abajo para probarlo de verdad")).className = "pastilla verde ejemplo";
    $("#texto").placeholder = "Escribí tu pregunta…";
  } catch { /* el visitante la cortó */ }
}

function sacarEjemplo() {
  if (demo === "apagado") return false;
  demo = "apagado";
  $("#texto").value = "";
  $("#texto").placeholder = "Mensaje";
  $("#estado").textContent = "en línea · demo con datos ficticios";
  const viejos = [...document.querySelectorAll(".ejemplo")].reverse();
  if (!viejos.length) return false;
  viejos.forEach((el, i) => setTimeout(() => el.classList.add("chau"), i * 70));
  setTimeout(() => {
    viejos.forEach(el => el.remove());
    const p = agregar("pastilla", "Listo, ahora es en serio ✨");
    p.className = "pastilla verde";
    setTimeout(() => p.remove(), 2200);
  }, viejos.length * 70 + 650);
  return true;
}

if (DEMO) {
  // Solo cuentan los gestos reales del visitante (isTrusted), no el tipeo del guion
  const cortar = e => {
    if (!e.isTrusted || demo === "apagado") return;
    const habia = demo !== "esperando";
    sacarEjemplo();
    if (habia && !e.target.closest("#rapidas")) {
      $("#rapidas").style.display = "";
      $("#rapidas").classList.add("vuelve");
    }
  };
  $("#texto").addEventListener("keydown", cortar, true);
  $("#texto").addEventListener("pointerdown", cortar, true);
  $("#rapidas").addEventListener("pointerdown", cortar, true);
  addEventListener("message", e => { if (e.data?.tipo === "demo-click") reproducir(); });
  addEventListener("load", avisarPosicion);
  addEventListener("resize", avisarPosicion);
  avisarPosicion();

  if (parent === window) setTimeout(reproducir, 1500);
}
</script>
